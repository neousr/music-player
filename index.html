<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Julio César">
    <meta name="keywords"
        content="Audio Player, Music Player, Web Player, Music APP, Reproductor de Música, Reproductor de Audio, Reproductor Web de Audio">
    <link rel="shortcut icon" href="img/neobte_logo.png" type="image/png" sizes="16x16 32x32">
    <!-- Preconnect (speed boost) -->
    <link rel="preconnect" href="https://neobte.github.io" crossorigin>
    <title>Neobte - Music Player</title>

    <style>
        :root {
            /* --color: rgb(0, 255, 0); */
            /* --color: rgb(0, 180, 255); */
            --color: rgb(31, 111, 235);
            --color: rgb(96, 215, 30);
            --bg: #0b0e19;

            --progress-color: var(--color);
            --track-color: #1e232a;
            --slider-height: 4px;
            --slider-br: .25rem;

            --color-muted: #9198a1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        body {
            /* 1 pulgada = 2.54cm = 96px */
            /* margin: 96px; */
            margin: 1rem;
            background-color: #0d1117;
            color: #f0f6fc;
        }

        .container {
            width: 100%;
            max-width: 560px;
            /*padding-right: calc(1.5rem * .5);
            padding-left: calc(1.5rem * .5);*/
            margin-right: auto;
            margin-left: auto;
            padding: 1rem;
        }

        /* Styles input range */
        .slider {
            -webkit-appearance: none;
            width: 100%;
            background-color: transparent;
            cursor: pointer;
        }

        .slider:focus {
            outline: none;
        }

        .slider:disabled {
            cursor: default;
            opacity: .3;
        }

        /* Mozilla Firefox */
        .slider::-moz-range-track {
            background-color: var(--track-color);
            height: var(--slider-height);
            border-radius: var(--slider-br);
        }

        .slider::-moz-range-progress {
            background-color: var(--progress-color);
            height: var(--slider-height);
            border-radius: var(--slider-br);
        }

        .slider::-moz-range-thumb {
            border: none;
            background-color: var(--progress-color);
            border-radius: 50%;
        }

        .slider:disabled::-moz-range-thumb {
            height: 0;
            width: 0;
        }

        .slider:not(:disabled):hover::-moz-range-thumb {
            transform: scale(1.3);
        }

        /* Google Chrome */
        .slider::-webkit-slider-runnable-track {
            background-color: var(--progress-color);
            height: var(--slider-height);
            border-radius: var(--slider-br);
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            background-color: var(--progress-color);
            height: 13px;
            width: 13px;
            border-radius: 50%;
            margin-top: -5px;
        }

        .slider:focus::-webkit-slider-runnable-track {
            background-color: var(--track-color);
        }

        .slider:not(:disabled):hover::-webkit-slider-thumb {
            transform: scale(1.3);
        }

        .slider:disabled::-webkit-slider-thumb {
            height: 0;
            width: 0;
        }

        /* End Input range styles */

        .player-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: .875rem;
        }

        .player-info > * {
            width: 50px;
            font-variant-numeric: tabular-nums;
        }

        .playing {
            background-color: rgb(96, 215, 30, .16) !important;
        }

        .btn {
            background: none;
            border: none;
            outline: none;
            color: var(--color-muted);
            width: 44px;
            height: 44px;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            /* Firefox => 1px 4px; chrome => 1px 6px */
            padding: 0;
            font-size: 1rem;

            cursor: pointer;
            transition-duration: 0.4s;

            /* width: 44px; */
            /* height: 44px; */
            /* Teniendo la fuente en 1rem o 16px, el tamaño del icono es de 24px 24px */
            /* Teniendo la fuente en 0.917 rem, el tamaño del icono es de 22.008px 22.008px*/
            /* min-block-size: 32px; */
            /* min-inline-size: 32px; */
        }

        /* HOVER solo si está activo */
        button:not(:disabled):hover {
            color: #dee2e6;
        }

        button:disabled {
            color: rgba(109, 109, 109, 1);
            cursor: not-allowed;
        }

        #play-pause-btn:disabled {
            background-color: rgba(109, 109, 109, 1);
        }

        #play-pause-btn {
            min-block-size: 48px;
            min-inline-size: 48px;
            /* Esto hará que el tamaño del icono play/pause sea de 30px 30px */
            font-size: 1.3rem;
            background-color: #dee2e6;
            color: #0d1117;
            aspect-ratio: 1/1;
            border-radius: 50%;
        }

        .select {
            width: 100%;
            padding: 0.75rem 1rem;
            text-align: center;
            display: inline-block;
            border: none;
            border-radius: .5rem;
            background-color: #151b23;
            color: #f0f6fc;
            outline: none;
            font-size: .875rem;
        }

        .icon {
            height: 1.5em;
            width: auto;
        }

        /* Utilities */
        .flex {
            display: flex;
            align-items: center;
        }

        .center {
            justify-content: center;
        }

        .space-between {
            justify-content: space-between;
        }

        .text-start {
            text-align: start;
        }

        .text-center {
            text-align: center;
        }

        .text-end {
            text-align: end;
        }

        .hidden {
            display: none;
        }

        .visible {
            display: inline;
        }

        .fs-12 {
            font-size: .75rem;
        }

        .fs-14 {
            font-size: .875rem;
        }

        .mb-1 {
            margin-bottom: 1rem;
        }

        .mt-1 {
            margin-top: 1rem;
        }

        /* Definición de la animación para el desplazamiento */
        @keyframes slideIn {
            0% {
                transform: translateX(100%);
                /* Comienza fuera de la pantalla por la derecha */
            }

            100% {
                transform: translateX(-100%);
                /* Se mueve hacia fuera de la pantalla por la izquierda */
            }
        }

        /* Dropdown styles */
        .dropdown-btn {
            background-color: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            bottom: 0;
            right: 0;
            background-color: #f1f1f1;
            min-width: 152px;
            overflow: auto;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        .dropdown-content.show {
            display: block;
        }

        .dropdown-content button {
            display: inline-flex;
            align-items: center;
            padding: 12px 16px;
            background-color: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            min-width: 152px;
            transition-duration: 0.4s;
            color: #0d1117;
        }

        .dropdown-content button:hover {
            background-color: #ddd;
        }

        /* End dropdown styles */

        .volume-control {
            display: flex;
            align-items: center;
            gap: .25rem;
        }

        #volume-btn {
            font-size: .875rem;
            /* clave */
            flex-shrink: 0;
            color: var(--color-muted);
        }

        #volume-icon {
            width: 1.2rem;
            height: 1.2rem;
        }

        #volume-value {
            min-width: 44px;
            font-size: .875rem;
            text-align: center;
            color: var(--color-muted);
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
        }

        .current-time-wrapper {
            height: 48px;
            margin-left: 13px;
            margin-right: 13px;
            color: var(--color-muted);
        }

        #repeat-btn.active,
        #shuffle-btn.active {
            color: var(--color);
        }

        .track {
            padding: .5rem;
            text-align: center;
        }

        .track-title {
            font-size: 1rem;
            font-weight: 500;
        }

        .track-artist {
            font-size: .875rem;
            color: var(--color-muted);
        }

        .track-title,
        .track-artist {
            /* La propiedad CSS white-space especifica cómo se manejan los espacios en blanco dentro de un elemento. */
            /* Cómo deshabilitar el ajuste de texto dentro de un elemento */
            /* https://www.w3schools.com/cssref/playdemo.php?filename=playcss_white-space&preval=nowrap */
            /* https://www.w3schools.com/css/css3_text_effects.asp */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-container {
            height: 306px;
            overflow-y: auto;
            overflow-x: hidden;
            margin-top: 1rem;
        }

        .playlist-container .track-title {
            font-size: .875rem;
        }

        .playlist-container .track-artist {
            font-size: .75rem;
        }

        .playlist {
            list-style-type: none;
        }

        .playlist-track {
            display: grid;
            grid-template-columns: 48px auto 48px;
            align-items: center;
            cursor: pointer;
            user-select: none;
            border-radius: .5rem;
            padding: .5rem 0;
        }
        
        .playlist-track:hover {
            background-color: #1e232a;
        }

        .playlist-track__number,
        .playlist-track__duration {
            font-size: .875rem;
            text-align: center;
        }

        .playlist-track__info {
            min-width: 0;
        }
    </style>
</head>

    <script>

        "use strict";

        const d = document;

        const pageTitle = d.querySelector("title");
        pageTitle.textContent = "Neobte - Music Player";

        const currentTimeSlider = d.getElementById("current-time-slider");
        const currentTime = d.getElementById("current-time");
        const duration = d.getElementById("duration");
        const countdown = d.getElementById("countdown");

        const volumeSlider = d.getElementById("volume-slider");
        const volumeBtn = d.getElementById("volume-btn");
        const volumeValue = d.getElementById("volume-value");

        const songArtist = d.getElementById("song-artist");
        const songTitle = d.getElementById("song-title");

        const playPauseBtn = d.getElementById("play-pause-btn");
        const forwardBtn = d.getElementById("forward-btn");
        const backwardBtn = d.getElementById("backward-btn");
        const repeatBtn = d.getElementById("repeat-btn");
        const shuffleBtn = d.getElementById("shuffle-btn");

        const totalSongs = d.getElementById("total-songs");
        const currentSong = d.getElementById("current-song");

        const selectPlaylist = d.getElementById("playlist");

        const container = d.querySelector('.playlist');

        const downloadLink = d.createElement('a');

        // Botones de controles
        const buttons = d.querySelectorAll(".controls button");

        let songs, numberOfSongs, songIndex;

        /*[
            { id: 1, artist: "Pedro Suárez Vértiz", title: "Te siento de sólo pensar", url: "https://neobte.github.io/music-player/audio/rock/Pedro%20Su%C3%A1rez%20V%C3%A9rtiz%20-%20Te%20siento%20de%20s%C3%B3lo%20pensar.m4a" },
            { id: 2, artist: "Bob Marley", title: "Jamming", url: "audio/Bob%20Marley%20-%20Jamming.m4a" },
            { id: 3, artist: "Michael Sembello", title: "Maniac", url: "audio/Michael%20Sembello%20-%20Maniac.m4a" },
            { id: 4, artist: "Virus", title: "Sin disfraz", url: "audio/Virus - Sin disfraz.m4a" },
            { id: 5, artist: "Mar de Copas", title: "Suna", url: "audio/Mar de Copas - Suna.m4a" },
        ];*/

        let audioPlayer = new Audio();
        // audioPlayer.preload = "metadata";
        // audioPlayer.controls = true;
        // d.body.appendChild(audioPlayer);

        const audioSourcePath = "https://neobte.github.io/musica/playlists/";

        const validOptions = ["my_playlist", "rock", "salsa"];

        let repeatState = 0, isRepeatAll = false;
        let isShuffle = false;
        let currentVolume = 1; // 1 = 100 %
        let playlistName;
        let previousRowActive = null;
        let previousSelectedPlaylist = "";

        d.addEventListener("DOMContentLoaded", e => {
            init();
        });

        const init = () => {

            // Al recargar la página reseteamos elementos
            selectPlaylist.value = "";
            currentTimeSlider.disabled = true;
            currentTimeSlider.value = 0;
            volumeSlider.value = 100;
            buttons.forEach(b => b.disabled = true);

            selectPlaylist.addEventListener("change", e => {
                if (selectPlaylist.selectedIndex === 0) return;
                playlistName = selectPlaylist.value;
                if (!validOptions.includes(playlistName)) return;
                if (previousSelectedPlaylist === playlistName) return;

                previousSelectedPlaylist = playlistName;
                // sendHttpRequest("GET", audioSourcePath + playlistName + "/playlist.json", null, handleResponse);
                const request_url = audioSourcePath + playlistName + "/playlist.json";
                sendFetchHttpRequest(request_url, handleResponse);
            });
        }

        const handleResponse = response => {

            // songs = JSON.parse(response).slice(0, 6);
            const playlist = JSON.parse(response);

            songs = playlist.tracks.items;
            // console.log(songs)
            // songs.sort((a, b) => a.title.localeCompare(b.title));
            // Si recibimos la respuesta YA PARSEADA ESTARIAMOS HACIENDO LO SIGUIENTE:
            // songs = [{}, {}, {}, ...], asignación de referencia
            // console.table(songs);
            // const songsCopy = structuredClone(songs);
            numberOfSongs = playlist.tracks.total;
            songIndex = 0;

            totalSongs.textContent = numberOfSongs;

            // ¿Podemos eliminar esta condición? La respuesta es NO
            if (songIndex < numberOfSongs) {
                // 1. Mostramos la playlist
                displayPlaylist(songs);
                // 2. Cargamos el índice cero de forma predeterminada
                loadSong(songIndex);
                // 3. Reproducimos
                playAudio();

                d.getElementById("playlist-duration-display").textContent = getPlaylistDuration(songs);

                if (currentTimeSlider.disabled) {
                    // Habilitamos la barra de tiempo
                    currentTimeSlider.disabled = false;
                    // Habilitamos los botones de control
                    for (let button of buttons) {
                        button.disabled = false;
                    }

                    d.querySelector(".current-time-wrapper").style.color = "#a8b3bd";
                }

                if (isShuffle) {
                    isShuffle = false;
                    shuffleBtn.click();
                }
            }
        };

        const loadSong = songIndex => {
            audioPlayer.pause();
            audioPlayer.src = audioSourcePath + playlistName + "/" + songs[songIndex].name;
            audioPlayer.dataset.songId = songs[songIndex].id;
            
            // songInfo.textContent = `${songs[songIndex].artist} - ${songs[songIndex].title}`;
            songArtist.textContent = songs[songIndex].artist;
            songTitle.textContent = songs[songIndex].title;
            pageTitle.textContent = `${songs[songIndex].title} - ${songs[songIndex].artist}`;
            // No animation
            // setAnimation(songInfo);

            currentSong.textContent = isShuffle ? songs[songIndex].id : songIndex + 1;
        }

        const setAnimation = title => {
            if (title.scrollWidth > parentElementOffsetWidth) {
                title.style.animation = "slideIn 16s linear infinite";
            } else {
                title.style.animation = "none";
            }
        }

        // "1\tSi ya no estás - 3-2 Get Funky\t4:29"
        const displayPlaylist = songs => {
            container.innerHTML = '';
            const fragment = d.createDocumentFragment();
            for (let idx = 0; idx < numberOfSongs; idx++) {
                const li = document.createElement("li");
                li.dataset.songId = songs[idx].id;
                li.dataset.rowIndex = idx;
                li.classList.add("playlist-track");
                li.innerHTML = `
                    <div class="playlist-track__number">
                        <span>${songs[idx].id}</span>
                    </div>
                    <div class="playlist-track__info">
                        <h3 class="track-title">${songs[idx].title}</h3>
                        <p class="track-artist">${songs[idx].artist}</p>
                    </div>
                    <div class="playlist-track__duration">
                        <span>${formatTime(songs[idx].duration)}</span>
                    </div>
                `;
                fragment.appendChild(li);
            }
            container.appendChild(fragment);
            container.children[songIndex].classList.add("playing");
            previousRowActive = container.children[songIndex];
            scrollRowIntoView(previousRowActive);
        }

        container.addEventListener("click", e => {
            const li = e.target.closest("li");
            if (!li) return;

            if (li.classList.contains("playing")) {
                audioPlayer.paused ? playAudio() : pauseAudio();
                return;
            }

            if (!isShuffle) songIndex = +li.dataset.rowIndex;
            const song = getSongById(+li.dataset.songId);
            
            try {

                if (previousRowActive) previousRowActive.classList.remove("playing");
                audioPlayer.pause();
                audioPlayer.src = audioSourcePath + playlistName + "/" + song.name;
                playAudio();
                li.classList.add("playing");
                previousRowActive = li;

                audioPlayer.dataset.songId = song.id;
                currentSong.textContent = song.id;
                // songInfo.textContent = `${song.artist} - ${song.title}`;
                songArtist.textContent = song.artist;
                songTitle.textContent = song.title;
                pageTitle.textContent = `${song.title} - ${song.artist}`;

                // setAnimation(songInfo);

                // d.body.style.background = `linear-gradient(to right, ${getRandomHexColor(15)}, ${getRandomHexColor(15)})`;
            } catch (error) {
                console.log("No se pudo reproducir", error);
            }
        });

        const getSongById = id => {
            return songs.find(song => song.id === id);
        }

        const updateRowActive = () => {
            if (previousRowActive) previousRowActive.classList.remove("playing");
            previousRowActive = container.querySelector(`li[data-song-id="${songs[songIndex].id}"]`);
            previousRowActive.classList.add("playing");
            scrollRowIntoView(previousRowActive);
        }

        const scrollRowIntoView = row => {
            row.scrollIntoView({ behavior: "auto", block: "center" });
        }

        const updateDuration = () => {
            if (isFinite(audioPlayer.duration) && audioPlayer.duration > 0) {
                currentTime.textContent = "0:00";
                duration.textContent = formatTime(audioPlayer.duration);
                // countdown.textContent = `-${formatTime(audioPlayer.duration - 0)}`;

                currentTimeSlider.max = audioPlayer.duration; // El maximo de la barra de progreso
                currentTimeSlider.value = 0; // Inicia en 0
            }
        }

        audioPlayer.addEventListener("loadedmetadata", updateDuration);
        audioPlayer.addEventListener("durationchange", updateDuration);

        audioPlayer.addEventListener("timeupdate", e => {
            // Esta condición evita el error en el formateo de tiempo, por ejemplo: -5:NaN
            if (isFinite(audioPlayer.duration) && audioPlayer.duration > 0) {
                currentTime.textContent = formatTime(audioPlayer.currentTime);
                currentTimeSlider.value = audioPlayer.currentTime;
                // countdown.textContent = `-${formatTime(audioPlayer.duration - audioPlayer.currentTime)}`;
            }
        });

        currentTimeSlider.addEventListener("input", e => {
            if (currentTimeSlider.disabled) return;
            audioPlayer.currentTime = Number(currentTimeSlider.value);
        });

        audioPlayer.addEventListener("ended", e => {
            if (songIndex >= numberOfSongs - 1 && !isRepeatAll) {
                playPauseBtn.title = "Reproducir";

                playPauseBtn.children[0].style.display = "inline";
                playPauseBtn.children[1].style.display = "none";

                songIndex = 0;
                loadSong(songIndex);
                updateRowActive();
                return;
            }
            forwardBtn.click();
            playAudio();
        });

        // Volume slider
        volumeSlider.addEventListener("input", () => {
            volumeValue.textContent = volumeSlider.value;
            audioPlayer.volume = Number(volumeSlider.value) / 100; // number
            if (volumeSlider.value === "0") {
                audioPlayer.muted = true;
                currentVolume = 0.5; // 50 %
                volumeBtn.title = "Activar sonido";

                volumeBtn.children[0].style.display = "none";
                volumeBtn.children[1].style.display = "inline";
            } else {
                audioPlayer.muted = false;
                currentVolume = Number(volumeSlider.value) / 100; //  Values are between 0 y 100, "33" / 100 = 0.33 number
                volumeBtn.title = "Silenciar";

                volumeBtn.children[0].style.display = "inline";
                volumeBtn.children[1].style.display = "none";
            }
        });

        volumeBtn.addEventListener("click", () => {
            audioPlayer.muted = !audioPlayer.muted;
            if (audioPlayer.muted) {
                audioPlayer.volume = 0;
                volumeSlider.value = 0;
                volumeBtn.title = "Activar sonido";

                volumeBtn.children[0].style.display = "none";
                volumeBtn.children[1].style.display = "inline";
            } else {
                audioPlayer.volume = currentVolume; // Values are  between 0.1 and 1, where 1 = 100 %
                volumeSlider.value = currentVolume * 100; // Values are between 0 and 100
                volumeBtn.title = "Silenciar";

                volumeBtn.children[0].style.display = "inline";
                volumeBtn.children[1].style.display = "none";
            }
            volumeValue.textContent = volumeSlider.value;
        });

        const pauseAudio = () => {
            audioPlayer.pause();
            playPauseBtn.title = "Reproducir";

            playPauseBtn.children[0].style.display = "inline";
            playPauseBtn.children[1].style.display = "none";
        };

        const playAudio = async () => {
            await audioPlayer.play();
            playPauseBtn.title = "Pausar";

            playPauseBtn.children[0].style.display = "none";
            playPauseBtn.children[1].style.display = "inline";
        };

        // Controls
        playPauseBtn.addEventListener("click", e => {
            if (audioPlayer.src === "") return;
            audioPlayer.paused ? playAudio() : pauseAudio();
        });

        forwardBtn.addEventListener("click", e => {
            if (audioPlayer.src === "") return;
            songIndex = (songIndex + 1) % numberOfSongs;
            if (!audioPlayer.paused) {
                loadSong(songIndex);
                playAudio();
            } else {
                loadSong(songIndex);
            }
            updateRowActive();
            // background: linear-gradient(to right, #6f0000, #200122);
            // https://uigradients.com
            // d.body.style.background = `linear-gradient(to right, ${getRandomHexColor(15)}, ${getRandomHexColor(15)})`;
        });

        backwardBtn.addEventListener("click", e => {
            if (audioPlayer.src === "") return;

            // Umbral de 5 segundos.
            if (audioPlayer.currentTime > 5) {
                audioPlayer.currentTime = 0;
            } else {
                songIndex = (songIndex - 1 + numberOfSongs) % numberOfSongs;
                if (!audioPlayer.paused) {
                    loadSong(songIndex);
                    playAudio();
                } else {
                    loadSong(songIndex);
                }
                updateRowActive();
            }
        });

        repeatBtn.addEventListener("click", e => {
            if (audioPlayer.src === "") return;
            repeatState = (repeatState + 1) % 3;
            if (repeatState === 0) {
                audioPlayer.loop = false;
                repeatBtn.title = "Repetir playlist";

                repeatBtn.children[1].style.display = "none";
                repeatBtn.children[0].style.display = "inline";

                // repeatBtn.style.removeProperty("color");
                repeatBtn.classList.remove("active");
                return;
            }
            if (repeatState === 1) {
                isRepeatAll = true;
                repeatBtn.title = "Repetir canción indefinidamente";

                repeatBtn.children[0].querySelector("circle").style.display = "inline";
                // repeatBtn.style.color = "#67ff4d";// esta
                repeatBtn.classList.add("active");
                return;
            }
            if (repeatState === 2) {
                isRepeatAll = false;
                audioPlayer.loop = true;
                repeatBtn.title = "Desactivar la repetición indefinida";

                repeatBtn.children[0].querySelector("circle").style.display = "none";
                repeatBtn.children[0].style.display = "none";

                repeatBtn.children[1].style.display = "inline";
                return;
            }
        });

        shuffleBtn.addEventListener("click", e => {
            if (audioPlayer.src === "") return;
            isShuffle = !isShuffle;
            if (isShuffle) {
                // Buscar el índice de la canción actualmente en reproducción
                const index = songs.findIndex(song => song.id === +(audioPlayer.dataset.songId));
                // Extraer o eliminar la canción del array
                const currentlyPlayingSong = songs.splice(index, 1)[0];
                // Mezclar el array in place sin la canción que se encontraba en reproducción
                shuffle(songs);
                // Insertar la canción que se encontraba sonando en el índice cero despues de la mezcla
                songs.unshift(currentlyPlayingSong);
                // Seteamos songIndex a cero, de forma que la proxima canción sea el índice 1
                songIndex = 0;
                // console.table(songs);
                shuffleBtn.title = "Desactivar reproducción aleatoria";

                shuffleBtn.children[0].querySelector("circle").style.display = "inline";

                // shuffleBtn.style.color = "#67ff4d"; // esta
                shuffleBtn.classList.add("active");
            } else {
                // Devolvemos el orden original, ordenando el array de objetos por la clave id
                songs.sort((a, b) => a.id - b.id);
                songIndex = songs.findIndex(song => song.id === +(audioPlayer.dataset.songId));

                shuffleBtn.title = "Activar reproducción aleatoria";

                shuffleBtn.children[0].querySelector("circle").style.display = "none";

                // shuffleBtn.style.removeProperty("color"); //  esta
                shuffleBtn.classList.remove("active");
            }
        });

        // Format time in hh:mm:ss or mm:ss
        const formatTime = (seconds, format = 0) => {
            if (!isFinite(seconds) || seconds <= 0) return "0:00";
            // Int mod Int = Int
            const h = Math.floor(seconds / 3600); // hours calculation
            const min = Math.floor(seconds / 60) % 60; // min calculation
            const s = Math.floor(seconds) % 60; // Whole seconds

            if (format === 0) {
                return h > 0
                    ? `${/*h < 10 ? "0" + h : */h}:${min < 10 ? "0" + min : min}:${s < 10 ? "0" + s : s}`
                    : `${/*min < 10 ? "0" + min : */min}:${s < 10 ? "0" + s : s}`;
            }

            return h > 0
                ? // Show hours min seconds format => 10 h 8 min 47 s
                `${h} h ${min} min ${s} s`
                : // Show min seconds format => 8 min 47 s
                `${min} min ${s} s`;
        };

        // https://introcs.cs.princeton.edu/java/14array/Deck.java.html
        const shuffle = arr => {
            const n = arr.length;
            for (let i = 0; i < n; i++) {
                const r = i + Math.floor(Math.random() * (n - i));
                [arr[i], arr[r]] = [arr[r], arr[i]];
            }
            return arr;
        };

        // https://fetch.spec.whatwg.org/
        // https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API/Using_Fetch
        const sendFetchHttpRequest = async (url, callback, method = "GET", data = {}) => {
            method = method.toUpperCase();

            const options = {
                method,
                headers: {}
            };

            if (method === 'GET') {
                const queryString = new URLSearchParams(data).toString();
                url += queryString ? `?${queryString}` : '';
            }

            if (method === 'POST') {
                options.headers['Content-Type'] = 'application/x-www-form-urlencoded';
                // options.headers['Accept'] = "application/json, text/javascript, */*; q=0.01";
                // options.headers['Accept-Language'] = "es-AR,es;q=0.9,en-US;q=0.8,en;q=0.7";
                // options.headers['Sec-Fetch-Mode'] = "cors";
                // options.headers['Sec-Fetch-Site'] = "same-origin";
                options.body = new URLSearchParams(data).toString();
                // options.mode = "cors";
                // options.referrer = "https://www.correoargentino.com.ar/";
                // options.body = "action=localidades&localidad=none&calle=&altura=&provincia=B"
            }

            try {
                const response = await fetch(url + (/\?/.test(url) ? "&" : "?") + new Date().getTime(), options);
                if (!response.ok) throw new Error(`Error HTTP: ${response.status}`);

                const contentType = response.headers.get("content-type");
                // console.log(contentType); // application/json; charset=utf-8
                if (contentType &&
                    contentType.toLowerCase().indexOf("application/json") >= 0) {
                    // Content-Type: text/html; charset=UTF-8
                    // callback(await response.json()); // Esto asignaría la referencia a la variable "songs"
                    callback(await response.text()); // Para parsear el string con JSON.parse y asignar a la variable "songs"
                }
            } catch (error) {
                console.log(error.message);
            }
        };

        // Send request
        function sendHttpRequest(method, url, data, callback) {
            const xhr = getXhr();
            xhr.onreadystatechange = processRequest;
            function getXhr() {
                if (window.XMLHttpRequest) {
                    return new XMLHttpRequest();
                } else {
                    return new ActiveXObject("Microsoft.XMLHTTP");
                }
            }
            function processRequest() {
                if (xhr.readyState == XMLHttpRequest.DONE) {
                    if (xhr.status == 200 && xhr.response != null) {
                        if (callback) callback(xhr.response);
                    } else {
                        console.log(
                            "There was a problem retrieving the data: " + xhr.statusText
                        );
                    }
                }
            }
            xhr.open(method, url + (/\?/.test(url) ? "&" : "?") + new Date().getTime());
            xhr.onloadstart = function (e) {
                /*openLoader();*/
            };
            xhr.onloadend = function (e) {
                /*closeLoader();*/
            };
            if (data && !(data instanceof FormData))
                xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
            xhr.send(data);
            xhr.onerror = function (e) {
                console.log("Error: " + e + " Could not load url.");
            };
        }

        const parseName = name => {
            const dash = name.indexOf(' - ');
            const dot = name.lastIndexOf(".");
            return name.slice(dash + 3, dot) + " - " + name.slice(0, dash);
        }

        const rmExt = name => {
            return name.slice(0, -4);
        }

        const getRandomHexColor = (max = 256) => {
            if (0 > max || max > 256) return;
            return '#' +
                ((Math.random() * max) | 0).toString(16).padStart(2, '0') +
                ((Math.random() * max) | 0).toString(16).padStart(2, '0') +
                ((Math.random() * max) | 0).toString(16).padStart(2, '0');
        }

        const getPlaylistDuration = songs => {
            let totalSeconds = 0, len = songs.length;
            for (let i = 0; i < len; i++) {
                totalSeconds += songs[i].duration;
            }
            return formatTime(totalSeconds, 1);
        }

        const downloadSong = async url => {
            const decodeURI = decodeURIComponent(url);
            const name = decodeURI.slice(decodeURI.lastIndexOf("/") + 1, -4);

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`Error HTTP: ${response.status}`);
                const contentType = response.headers.get('Content-Type');

                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);

                const a = d.createElement('a');
                a.href = blobUrl;
                a.download = name;
                a.click();

                URL.revokeObjectURL(blobUrl);
            } catch (error) {
                console.error('Error al descargar el archivo:', error);
            }
        }

        const rmWhiteSpaces = text => {
            return text.trim().replace(/\s\s+/g, " ");
        }

        const echo = (message = null) => {
            const div = document.createElement("div");
            div.style.cssText = `margin-top: .25rem;
    background-color: #f1f3f4;color: #000 !important;
    padding: .8rem;border-radius: .25rem;`;
            if (message === null) {
                div.textContent = "null";
            } else if (message === undefined) {
                div.textContent = "undefined";
            } else if (message instanceof HTMLElement) {
                div.textContent = message.outerHTML;
            } else if (Array.isArray(message) || typeof message === "object") {
                div.textContent = JSON.stringify(message, null, 2);
            } else {
                div.textContent = message;
            }
            document.body.appendChild(div);
            // setTimeout(() => { div.remove(); }, 10000);
        }

    </script>
